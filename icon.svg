<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Aluminium Window & Door Frame Graphic -->
  <!-- Outer Window Frame -->
  <rect x="116" y="110" width="280" height="230" rx="16" fill="none" stroke="#ffffff" stroke-width="16" />
  <!-- Glass Panes Background -->
  <rect x="126" y="120" width="125" height="100" rx="6" fill="#38bdf8" fill-opacity="0.25" />
  <rect x="261" y="120" width="125" height="100" rx="6" fill="#38bdf8" fill-opacity="0.25" />
  <rect x="126" y="230" width="125" height="100" rx="6" fill="#38bdf8" fill-opacity="0.25" />
  <rect x="261" y="230" width="125" height="100" rx="6" fill="#38bdf8" fill-opacity="0.25" />
  <!-- Window Dividers -->
  <line x1="256" y1="110" x2="256" y2="340" stroke="#ffffff" stroke-width="14" />
  <line x1="116" y1="225" x2="396" y2="225" stroke="#ffffff" stroke-width="14" />

  <!-- Glass Light Reflections -->
  <line x1="140" y1="130" x2="190" y2="210" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="275" y1="130" x2="325" y2="210" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Modern Workshop Ribbon / Banner -->
  <rect x="86" y="360" width="340" height="58" rx="29" fill="url(#goldGrad)" />
  <text x="256" y="398" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">BILAN WORKSHOP</text>

  <!-- Tagline below -->
  <text x="256" y="450" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">ALUMINIUM • PVC • DECORATION</text>
</svg>
